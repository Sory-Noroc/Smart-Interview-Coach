name: Test Interview microservice

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  contents: read
  
jobs:
  test-interview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        working-directory: ./backend/InterviewEngine
        run: chmod +x ./mvnw

      - name: Run Spring Boot Tests
        working-directory: ./backend/InterviewEngine
        run: ./mvnw clean verify
