name: Continuous Integration for Frontend Layer
# name: Build and Deploy React to S3

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'

permissions:
  contents: read

jobs:
  ci-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json' 

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Run tests
        run: npm test
