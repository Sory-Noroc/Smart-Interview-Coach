name: Build and Deploy React to S3

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json' 

    - name: Install Dependencies
      run: npm ci

    - name: Build React App
      run: npm run build

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::092466876239:role/github-actions-s3-control-role
        aws-region: eu-central-1

    - name: Deploy to S3
      run: |
        aws s3 sync dist/ s3://jobacer-frontend/ --delete

  #  After running the app and seeing the Cloudfront dist id, add the invalidation
    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id EXCDNJTOCWW3N \
          --paths "/*"
      # DIST ID has to be changed on reconstruction of the infrastructure
