name: Build and Push Spring Boot to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read
  
jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./backend/UAC/mvnw

      - name: Run Spring Boot Tests
        run: ./backend/UAC/mvnw clean verify

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::092466876239:role/github-actions-ecs-deploy-role
          aws-region: us-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: uac
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend/UAC/
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
