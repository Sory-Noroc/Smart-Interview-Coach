version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: licenta-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: licenta-s3
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${S3_PASSWORD:-password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  uac:
    build:
      context: ./backend/UAC
      dockerfile: Dockerfile
    container_name: uac-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - db

  interview-engine:
    build:
      context: ./backend/InterviewEngine
      dockerfile: Dockerfile
    container_name: interview-engine-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-password}
      SPRING_CLOUD_AWS_S3_ENDPOINT: http://minio:9000
      SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY: ${S3_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      - db
      - minio

volumes:
  postgres_data:
  minio_data:
